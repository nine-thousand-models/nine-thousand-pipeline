---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-or-raise-pr
spec:
  workspaces:
    - name: output
  params:
    - name: MODEL_NAME
      description: Name of the application
      type: string
    - name: WORK_DIRECTORY
      description: Directory to start build in (handle multiple branches)
      type: string
    - name: DEPLOY_ENVIRONMENT
      description: Environment to deploy the app
      type: string
    - name: PROJECT_NAME
      description: Name of the team that doing this exercise :)
      type: string
    - name: VERSION
      description: Version of the application
      type: string
    - name: REPOSITORY
      description: Image Repository of the application
      type: string
      default: "image-registry.openshift-image-registry.svc:5000"
  steps:
    - name: patch-argo-conf
      workingDir: $(workspaces.output.path)/$(params.WORK_DIRECTORY)
      image: quay.io/redhat-cop/tekton-task-helm:3.6.3
      env:
        - name: HOME
          value: /tmp
      script: |
        #!/bin/sh

        CONFIG_FILE="$(params.DEPLOY_ENVIRONMENT)/$(params.MODEL_NAME)/config.yaml"
        CONFIG_DIR="$(params.DEPLOY_ENVIRONMENT)/$(params.MODEL_NAME)"

        # Check if config.yaml exists, create if it doesn't
        if [[ ! -f "$CONFIG_FILE" ]]; then
        mkdir -p "$CONFIG_DIR"
        cat <<EOF > "$CONFIG_FILE"
        ---
        chart_path: charts/model-deployment/simple
        name: $(params.MODEL_NAME)
        image_repository: image-registry.openshift-image-registry.svc:5000
        image_namespace: $(params.PROJECT_NAME)-$(params.DEPLOY_ENVIRONMENT)
        version: $(params.VERSION)
        EOF
        fi

        if [[ $(params.DEPLOY_ENVIRONMENT) == "test" ]]; then
            yq eval -i ".version=\"$(params.VERSION)\"" "$CONFIG_FILE"
            yq eval -i ".image_repository=\"image-registry.openshift-image-registry.svc:5000\"" "$CONFIG_FILE"
            yq eval -i ".image_namespace=\"$(params.PROJECT_NAME)-$(params.DEPLOY_ENVIRONMENT)\"" "$CONFIG_FILE"
        elif [[ $(params.DEPLOY_ENVIRONMENT) == "prod" ]]; then
            git checkout -b $(params.MODEL_NAME)-$(params.VERSION)
            yq eval -i ".version=\"$(params.VERSION)\"" "$CONFIG_FILE"
            yq eval -i ".image_repository=\"image-registry.openshift-image-registry.svc:5000\"" "$CONFIG_FILE"
            yq eval -i ".image_namespace=\"$(params.PROJECT_NAME)-$(params.DEPLOY_ENVIRONMENT)\"" "$CONFIG_FILE"
        fi

    - name: commit-changes
      workingDir: $(workspaces.output.path)/$(params.WORK_DIRECTORY)
      image: quay.io/redhat-cop/ubi8-git:latest
      env:
        - name: HOME
          value: /tmp
      script: |
        #!/bin/sh
        set -eu

        # ⚠️ Hardcoded creds (works, but insecure)
        GIT_USER="user1"
        GIT_PASS="thisisthepassword"

        GITEA_HOST="gitea-gitea.apps.cluster-r8s6x.r8s6x.sandbox1098.opentlc.com"
        OWNER="user1"
        REPO="nine-thousand-models-gitops"

        # Git remote (basic auth in URL)
        GIT_REMOTE="https://${GIT_USER}:${GIT_PASS}@${GITEA_HOST}/${OWNER}/${REPO}.git"

        # Gitea API
        API_BASE="https://${GITEA_HOST}/api/v1"

        git config --global user.email "tekton@mlops.bot.com"
        git config --global user.name "🐈 Tekton 🐈"
        git config --global push.default simple
        git config --global --add safe.directory '*'

        git remote set-url origin "$GIT_REMOTE"

        if [ "$(params.DEPLOY_ENVIRONMENT)" = "test" ]; then
          # Fetch latest changes and handle local modifications
          git fetch origin main

          # Stash local changes from patch-argo-conf step
          git stash

          # Reset to origin/main to avoid divergent branches
          git checkout -B main origin/main

          # Restore local changes
          git stash pop || true

          git add "$(params.DEPLOY_ENVIRONMENT)/$(params.MODEL_NAME)/config.yaml"
          git commit -m "🚀 AUTOMATED COMMIT - Deployment of $(params.MODEL_NAME) for version $(params.VERSION) 🚀" || true
          git push origin HEAD:main
          echo "🫡 push completed (test)"

        elif [ "$(params.DEPLOY_ENVIRONMENT)" = "prod" ]; then
          BRANCH="$(params.MODEL_NAME)-$(params.VERSION)"

          # Fetch latest changes and handle local modifications
          git fetch origin main

          # Stash local changes from patch-argo-conf step
          git stash

          # Make sure we have main locally, then branch off it
          git checkout -B "$BRANCH" "origin/main"

          # Restore local changes
          git stash pop || true

          # Commit prod config changes on the branch
          git add "prod/$(params.MODEL_NAME)/config.yaml"
          git commit -m "🚀 AUTOMATED COMMIT - Deployment of $(params.MODEL_NAME) for version $(params.VERSION) 🚀" || true

          # Push the branch (NOT main)
          git push -u origin "HEAD:${BRANCH}"
          echo "🫡 pushed branch ${BRANCH} (prod)"

          # Create PR in Gitea: branch -> main
          # If your Gitea has a self-signed cert, add: curl -k ...
          curl -sS -u "${GIT_USER}:${GIT_PASS}" \
            -H "Content-Type: application/json" \
            -X POST "${API_BASE}/repos/${OWNER}/${REPO}/pulls" \
            -d "{
              \"title\": \"🤖 Model $(params.MODEL_NAME):$(params.VERSION) Prod Deployment\",
              \"body\": \"Automated prod deployment PR for $(params.MODEL_NAME) version $(params.VERSION).\\n\\n(Generated by Tekton)\",
              \"head\": \"${BRANCH}\",
              \"base\": \"main\"
            }"

          echo "☘️ PR created for prod $(params.MODEL_NAME) - v$(params.VERSION)"
        fi


